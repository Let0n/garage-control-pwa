<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Garage Control">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Garage Control</title>
  <style>
    :root { color-scheme: light dark; --bg:#101827; --panel:#1b2639; --text:#f4f7fb; --muted:#aab6c8; --accent:#3b82f6; --danger:#fca5a5; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100svh; font-family: system-ui,-apple-system,BlinkMacSystemFont,sans-serif; background:radial-gradient(ellipse at top,#263852,var(--bg) 60%); color:var(--text); display:grid; place-items:center; padding:24px; padding-top:max(24px,env(safe-area-inset-top)); padding-bottom:max(24px,env(safe-area-inset-bottom)); }
    main { width:min(100%,390px); text-align:center; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid #344258; border-radius:28px; padding:30px 24px 24px; box-shadow:0 20px 70px #0005; }
    .icon { width:90px;height:90px;margin:0 auto 18px;display:grid;place-items:center;border-radius:26px;background:#263750;color:#bfdbfe;font-size:48px }
    h1 { font-size:28px; margin:0 0 10px; letter-spacing:-.5px }
    #status { min-height:44px; color:var(--muted); font-size:15px; line-height:1.4; margin:0 0 22px; overflow-wrap:anywhere }
    button { width:100%; border:0; border-radius:16px; min-height:60px; padding:16px 20px; font:700 18px system-ui,sans-serif; color:white; background:var(--accent); box-shadow:0 7px 18px #2563eb44; cursor:pointer; touch-action:manipulation }
    button:disabled { opacity:.55; cursor:wait }
    .hint { color:var(--muted); font-size:12px; line-height:1.5; margin:18px 4px 0 }
    .error { color:var(--danger)!important }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⌂</div>
    <h1>Garage Control</h1>
    <p id="status" role="status" aria-live="polite">Ready. Make sure Bluetooth is on and the ESP32 is nearby.</p>
    <button id="open" type="button">Open Garage</button>
    <p class="hint">Connects directly to your nearby ESP32-C3 over Bluetooth. No home Wi‑Fi or internet connection to the ESP32 is required.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
