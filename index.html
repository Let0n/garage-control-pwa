<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GarageControl">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>GarageControl</title>
</head>
<body>
<main class="app">
  <div class="eyebrow">GARAGE CONTROL</div>
  <h1>Garage</h1>
  <p id="status" role="status" aria-live="polite">Ready to connect</p>
  <button id="garageButton" type="button">Open/Close Garage</button>
  <p class="hint">Tap to connect to your ESP32 and send the garage command.</p>
</main>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
